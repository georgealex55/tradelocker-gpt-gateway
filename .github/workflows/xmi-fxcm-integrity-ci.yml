name: XMI FXCM source integrity regression (research only)
on:
  push:
    branches:
      - research/xmi-amd-seven-pair-fxcm-replay-20261107
    paths:
      - 'tests/test_xmi_fxcm_integrity.py'
      - 'scripts/xmi-amd-fxcm-seven-pair-replay.py'
      - '.github/workflows/xmi-fxcm-integrity-ci.yml'
  pull_request:
    branches:
      - research/xmi-amd-retest-stp-20261107
    paths:
      - 'tests/test_xmi_fxcm_integrity.py'
      - 'scripts/xmi-amd-fxcm-seven-pair-replay.py'
      - '.github/workflows/xmi-fxcm-integrity-ci.yml'
permissions:
  contents: read
jobs:
  source-integrity:
    name: Python parser integrity + frozen AMD regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out research code without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Validate parser syntax
        run: python3 -m py_compile scripts/xmi-amd-fxcm-seven-pair-replay.py tests/test_xmi_fxcm_integrity.py
      - name: Run offline FXCM UTC and bid-ask regression tests
        run: |
          python3 -m unittest discover -s tests -p 'test_xmi_fxcm_integrity.py' -v 2>&1 | tee "$RUNNER_TEMP/fxcm-integrity.log"
      - name: Verify frozen AMD JavaScript regressions
        run: |
          node --version
          node --test tests/xmi-amd-retest.test.mjs 2>&1 | tee "$RUNNER_TEMP/amd-engine-regression.log"
      - name: Archive test log evidence (no market data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xmi-fxcm-integrity-regression-logs
          path: |
            ${{ runner.temp }}/fxcm-integrity.log
            ${{ runner.temp }}/amd-engine-regression.log
          if-no-files-found: warn
          retention-days: 30
