name: XMI read-only chart checks
on:
  pull_request:
    paths:
      - 'app/xmi/**'
      - 'app/api/xmi/**'
      - 'lib/xmiWorkspace.mjs'
      - 'lib/xmiLive*.mjs'
      - 'tests/xmi-live-engine.test.mjs'
      - 'tests/xmi-chart-lifecycle.test.mjs'
      - 'lib/xmiDeskState.mjs'
      - 'tests/xmi-desk.test.mjs'
      - 'lib/xmiContext.mjs'
      - 'lib/xmiJournal.mjs'
      - 'lib/xmiCloud*.mjs'
      - 'package.json'
      - 'tests/xmi-cloud.test.mjs'
      - 'tests/xmi-context.test.mjs'
      - 'tests/xmi-journal.test.mjs'
      - 'tests/xmi-workspace.test.mjs'
      - '.github/workflows/xmi-preview-checks.yml'
permissions:
  contents: read
jobs:
  chart-workspace:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout proposed branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned app dependencies for cloud-identity tests
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Syntax-check the chart settings
        run: |
          node --check lib/xmiWorkspace.mjs
          node --check lib/xmiLiveMath.mjs
          node --check lib/xmiLiveProvider.mjs
          node --check app/api/xmi/live/route.js
          node --check lib/xmiDeskState.mjs
          node --check lib/xmiContext.mjs
          node --check lib/xmiJournal.mjs
          node --check lib/xmiCloudConfig.mjs
          node --check lib/xmiCloudIdentity.mjs
          node --check lib/xmiCloudStore.mjs
          node --check lib/xmiCloudBrowser.mjs
          node --check app/api/xmi/auth/config/route.js
          node --check app/api/xmi/auth/exchange/route.js
          node --check app/api/xmi/journal/route.js
          node --check app/api/xmi/context/route.js
      - name: Test equity boundaries and widget configuration
        run: node --test tests/xmi-*.test.mjs
