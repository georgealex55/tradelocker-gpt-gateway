name: Structure A - Breakout Quality

on:
  workflow_dispatch:
  push:
    branches: [research/structure-a-breakout-quality]
    paths:
      - ".github/workflows/research-structure-a-breakout-quality.yml"
      - "scripts/structure-a-breakout-quality.mjs"
      - "docs/STRUCTURE_A_BREAKOUT_QUALITY_PROTOCOL.md"
      - "lib/research/marketStructure.mjs"
      - "tests/market-structure.test.mjs"
      - "package.json"

permissions:
  contents: read
  actions: read

concurrency:
  group: structure-a-breakout-quality
  cancel-in-progress: false

jobs:
  evaluate:
    if: github.ref == 'refs/heads/research/structure-a-breakout-quality'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Run research engineering tests
        run: npm run test:research
      - name: Download corrected frozen research archive
        uses: actions/download-artifact@v4
        with:
          name: portfolio-144-evaluation
          path: research-output
          run-id: 36506041404
          github-token: ${{ github.token }}
      - name: Run Structure A breakout quality experiment
        run: |
          node --loader ./scripts/research-loader.mjs scripts/structure-a-breakout-quality.mjs \
            research-output research-output/structure-a-breakout-quality
      - name: Upload breakout quality results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: structure-a-breakout-quality-results
          path: |
            research-output/structure-a-breakout-quality/results.json
            research-output/structure-a-breakout-quality/summary.csv
          if-no-files-found: warn
          retention-days: 30
