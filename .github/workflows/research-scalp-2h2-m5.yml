name: Scalp 2H.2 - USDCHF M5 Audit

on:
  workflow_dispatch:
  push:
    branches:
      - research/scalp-2h2-m5
    paths:
      - ".github/workflows/research-scalp-2h2-m5.yml"
      - "scripts/scalp-2h2-m5-audit.mjs"

concurrency:
  group: scalp-2h2-m5-audit
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit:
    if: github.ref == 'refs/heads/research/scalp-2h2-m5'
    name: Audit USDCHF M5 displacement
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      TRADE_APPROVAL_KEY: \${{ secrets.TRADE_APPROVAL_KEY }}
      VERCEL_AUTOMATION_BYPASS_SECRET: \${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      RESEARCH_GATEWAY: https://tradelocker-gpt-gateway-fnpid8533-georgealex1925-2750s-projects.vercel.app

    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify required research secrets
        shell: bash
        run: |
          test -n "$TRADE_APPROVAL_KEY" || { echo "TRADE_APPROVAL_KEY secret is missing"; exit 1; }
          test -n "$VERCEL_AUTOMATION_BYPASS_SECRET" || { echo "VERCEL_AUTOMATION_BYPASS_SECRET secret is missing"; exit 1; }

      - name: Run USDCHF M5 displacement audit
        run: |
          node scripts/scalp-2h2-m5-audit.mjs \
            --gateway "$RESEARCH_GATEWAY" \
            --from "2024-01-01T00:00:00.000Z"

      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scalp-2h2-m5-summary
          path: research-output/scalp-2h2-m5-summary.json
          if-no-files-found: warn
          retention-days: 14
