name: XMI research regression (isolated)
on:
  push:
    branches:
      - research/xmi-amd-seven-pair-fxcm-replay-20261107
    paths:
      - '.github/workflows/xmi-research-regression.yml'
      - 'tests/test_xmi_fxcm*.py'
      - 'tests/test_xmi_m5_continuity.py'
      - 'tests/test_xmi_fx_session_dst*.py'
      - 'scripts/xmi-*.py'
      - 'tests/test_xmi_evidence_preflight.py'
      - 'docs/research/xmi-gatesfx-evidence-ledger-20261110.json'
      - 'docs/research/xmi-gatesfx-snapshot-scenarios-20261109.json'
      - 'docs/research/XMI_GATESFX_RERUN_RESULTS_2026-11-09.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile historical importer
        run: python -m py_compile scripts/xmi-amd-fxcm-seven-pair-replay.py
      - name: Run five isolated offline regression suites (no vendor downloads)
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p 'test_xmi_fxcm_integrity.py' -v 2>&1 | tee fxcm-integrity.log
          python -m unittest discover -s tests -p 'test_xmi_fxcm_crossed_quarantine.py' -v 2>&1 | tee fxcm-quarantine.log
          python -m unittest discover -s tests -p 'test_xmi_m5_continuity.py' -v 2>&1 | tee m5-continuity.log
          python -m unittest discover -s tests -p 'test_xmi_fx_session_dst.py' -v 2>&1 | tee dst.log
          python -m unittest discover -s tests -p 'test_xmi_fx_session_dst_exact.py' -v 2>&1 | tee dst-exact.log
      - name: Check reused GatesFX evidence and stop duplicate screenshot requests
        run: |
          set -o pipefail
          python scripts/xmi-evidence-preflight.py --json | tee xmi-evidence-preflight.log
          python -m unittest discover -s tests -p 'test_xmi_evidence_preflight.py' -v 2>&1 | tee xmi-evidence-preflight-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xmi-regression-logs
          path: '*.log'
          retention-days: 14
