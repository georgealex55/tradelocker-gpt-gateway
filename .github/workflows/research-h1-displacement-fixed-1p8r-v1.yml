name: H1 Displacement GBPUSD SELL-Only V1

on:
  workflow_dispatch:
  push:
    branches: [research/h1-displacement-gbpusd-sell-only-v1]
    paths:
      - ".github/workflows/research-h1-displacement-fixed-1p8r-v1.yml"
      - "scripts/h1-displacement-fixed-1p8r-v1.mjs"
      - "docs/H1_DISPLACEMENT_GBPUSD_SELL_ONLY_V1_PROTOCOL.md"
      - "lib/research/engine.mjs"
      - "lib/research/policies.mjs"
      - "package.json"

permissions:
  contents: read
  actions: read

concurrency:
  group: h1-displacement-gbpusd-sell-only-v1
  cancel-in-progress: false

jobs:
  evaluate:
    if: github.ref == 'refs/heads/research/h1-displacement-gbpusd-sell-only-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Run research engineering tests
        run: npm run test:research

      - name: Download corrected frozen research archive
        uses: actions/download-artifact@v4
        with:
          name: portfolio-144-evaluation
          path: research-output
          run-id: 36506041404
          github-token: ${{ github.token }}

      - name: Run H1 displacement GBPUSD SELL-only backtest
        run: |
          node --loader ./scripts/research-loader.mjs scripts/h1-displacement-fixed-1p8r-v1.mjs \
            research-output research-output/h1-displacement-gbpusd-sell-only-v1

      - name: Upload backtest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h1-displacement-gbpusd-sell-only-v1-results
          path: |
            research-output/h1-displacement-gbpusd-sell-only-v1/results.json
            research-output/h1-displacement-gbpusd-sell-only-v1/summary.csv
          if-no-files-found: warn
          retention-days: 30

# trigger: gbpusd sell-only experiment

# trigger: force branch workflow run
