name: Price Breakout V1 - Frozen Historical Test

on:
  workflow_dispatch:
  push:
    branches: [research/portfolio-144]
    paths:
      - ".github/workflows/research-price-breakout-v1.yml"
      - "scripts/price-breakout-v1.mjs"
      - "docs/PRICE_BREAKOUT_V1_PROTOCOL.md"

permissions:
  contents: read
  actions: read

concurrency:
  group: price-breakout-v1
  cancel-in-progress: false

jobs:
  evaluate:
    if: github.ref == 'refs/heads/research/portfolio-144'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Run existing research engineering tests
        run: npm run test:research
      - name: Download corrected frozen research archive
        uses: actions/download-artifact@v4
        with:
          name: portfolio-144-evaluation
          path: research-output
          run-id: 36506041404
          github-token: ${{ github.token }}
      - name: Run pre-registered price breakout strategy
        run: |
          node --loader ./scripts/research-loader.mjs scripts/price-breakout-v1.mjs             research-output research-output/price-breakout-v1
      - name: Upload price-breakout results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: price-breakout-v1-results
          path: |
            research-output/price-breakout-v1/results.json
            research-output/price-breakout-v1/summary.csv
          if-no-files-found: warn
          retention-days: 30
