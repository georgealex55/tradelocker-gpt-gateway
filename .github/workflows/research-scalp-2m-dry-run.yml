name: Scalp 2M Dry Run

on:
  workflow_dispatch:
  push:
    branches:
      - research/scalp-2m-dry-run
    paths:
      - ".github/workflows/research-scalp-2m-dry-run.yml"
      - "app/api/trading/scalp-dry-run/route.js"
      - "lib/scalpShadow.mjs"
      - "lib/risk.js"
      - "lib/scalpStrategyCore.mjs"

concurrency:
  group: scalp-2m-dry-run
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    if: github.ref == 'refs/heads/research/scalp-2m-dry-run'
    name: Validate 2M dry-run harness
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: |
          node --check lib/risk.js
          node --check lib/scalpShadow.mjs
          node --check app/api/trading/scalp-dry-run/route.js

      - name: Production build
        run: npm run build
