name: XMI AMD seven-pair research replay (2022-2023 only)
# Historical 7-pair replay runs are intentionally MANUAL, with a documented new research question.
# Old PR triggers launched duplicate seven-pair failures on unrelated branch edits.
on:
  workflow_dispatch:
    inputs:
      research_question:
        description: 'What new hypothesis, code or data change justifies this historical replay?'
        required: true
        type: string
permissions:
  contents: read
jobs:
  seven-pair-2022-2023:
    name: ${{ matrix.symbol }} frozen AMD replay
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        symbol: [EURUSD, GBPUSD, USDJPY, USDCHF, AUDUSD, USDCAD, NZDUSD]
    steps:
      - name: Checkout research branch (no Git credentials retained)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Python runtime
        run: python3 --version
      - name: Verify historical replay regression tests
        run: node --test tests/xmi-amd-retest.test.mjs
      - name: Validate evidence registry and deliberate research reason
        run: |
          python3 scripts/xmi-evidence-preflight.py
          test -n '${{ inputs.research_question }}'
      - name: Download and validate FXCM 2022-23 UTC minute bars, replay frozen AMD
        run: |
          python3 scripts/xmi-amd-fxcm-seven-pair-replay.py \
            --symbol '${{ matrix.symbol }}' \
            --crossed-open-quote-policy quarantine \
            --out "$RUNNER_TEMP/amd-${{ matrix.symbol }}"
      - name: Print completion summary or explicit blocker
        if: always()
        run: |
          find "$RUNNER_TEMP/amd-${{ matrix.symbol }}" -maxdepth 1 -type f \
            \( -name '*-summary.json' -o -name '*-BLOCKED.json' \) \
            -exec sh -c 'for f do cat "$f"; done' sh {} + || true
      - name: Preserve per-pair audit and report without raw vendor price redistribution
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xmi-amd-${{ matrix.symbol }}-research-2022-2023
          path: |
            ${{ runner.temp }}/amd-${{ matrix.symbol }}/*-summary.json
            ${{ runner.temp }}/amd-${{ matrix.symbol }}/*-BLOCKED.json
            ${{ runner.temp }}/amd-${{ matrix.symbol }}/*-amd-2022.json
            ${{ runner.temp }}/amd-${{ matrix.symbol }}/*-amd-2023.json
          if-no-files-found: warn
          retention-days: 30
