name: Live Account Trade Preflight

on:
  workflow_dispatch:
  push:
    branches: [research/portfolio-144]
    paths:
      - ".github/workflows/live-trade-preflight.yml"

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GATEWAY: https://tradelocker-gpt-gateway.vercel.app
      TRADE_APPROVAL_KEY: ${{ secrets.TRADE_APPROVAL_KEY }}
    steps:
      - name: Verify approval secret
        run: test -n "$TRADE_APPROVAL_KEY"
      - name: Read production runtime
        run: |
          curl -sS "$GATEWAY/api/tradelocker/runtime-config" -o runtime.json
          node -e 'const r=require("./runtime.json"); console.log(JSON.stringify({stage:"runtime",ok:r.ok,tradingEnabled:r.runtime?.tradingEnabled,killSwitch:r.runtime?.killSwitch,expectedAccountId:r.runtime?.expectedAccountId,maxRiskPercent:r.runtime?.maxRiskPercent,maxLotsPerTrade:r.runtime?.maxLotsPerTrade,maxOrderUnits:r.runtime?.maxOrderUnits,vercelEnv:r.runtime?.vercelEnv,commit:r.runtime?.vercelGitCommitSha,ref:r.runtime?.vercelGitCommitRef}))'
      - name: Scan live production signal
        run: |
          curl -sS -H "x-trade-approval-key: $TRADE_APPROVAL_KEY" "$GATEWAY/api/trading/signals" -o signals.json
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const body=JSON.parse(fs.readFileSync('signals.json','utf8'));
          if(!body.ok) throw new Error('SIGNAL_SCAN_FAILED');
          const scan=body.result;
          const row=(scan.results||[]).find(x=>x.instrument?.symbol==='USDCHF') || scan.results?.[0];
          if(!row) throw new Error('NO_SIGNAL_ROW');
          console.log(JSON.stringify({
            stage:'signal',
            strategy:scan.strategy,
            version:scan.version,
            asOf:scan.asOf,
            symbol:row.instrument?.symbol,
            signalStatus:row.signal?.status,
            action:row.signal?.action,
            referenceEntry:row.signal?.referenceEntry,
            stopLoss:row.signal?.stopLoss,
            takeProfit:row.signal?.takeProfit,
            stopPips:row.signal?.stopPips,
            spreadPips:row.quote?.spreadPips,
            spreadAsStopFraction:row.signal?.spreadAsStopFraction,
            riskEstimate:row.riskEstimate,
            execution:row.execution,
            blocks:row.signal?.blocks || [],
            latestBarTime:row.latestBar?.time,
            completedThrough:row.completedThrough
          }));
          fs.writeFileSync('selected.json',JSON.stringify(row));
          JS
      - name: Manual live-account sizing probe
        run: |
          curl -sS "$GATEWAY/api/tradelocker/quote?symbol=USDCHF&tradableInstrumentId=7876&routeId=540002" -o quote.json
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const q=JSON.parse(fs.readFileSync('quote.json','utf8')).quote || {};
          if(!(q.bid>0) || !(q.ask>0)) throw new Error('LIVE_QUOTE_UNAVAILABLE');
          const pip=0.0001;
          const probes=[
            {name:'buy', body:{symbol:'USDCHF',tradableInstrumentId:7876,tradeRouteId:540005,infoRouteId:540002,side:'buy',type:'market',lots:0.01,qty:1000,stopLoss:q.ask-10*pip,takeProfit:q.ask+18*pip}},
            {name:'sell',body:{symbol:'USDCHF',tradableInstrumentId:7876,tradeRouteId:540005,infoRouteId:540002,side:'sell',type:'market',lots:0.01,qty:1000,stopLoss:q.bid+10*pip,takeProfit:q.bid-18*pip}}
          ];
          for(const p of probes) fs.writeFileSync('probe-'+p.name+'.json',JSON.stringify(p.body));
          console.log(JSON.stringify({stage:'quote',bid:q.bid,ask:q.ask,spread:q.spread}));
          JS
          for side in buy sell; do
            curl -sS -o "probe-$side-result.json" -X POST "$GATEWAY/api/tradelocker/risk-preview" -H "content-type: application/json" --data-binary @"probe-$side.json"
          done
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          for(const side of ['buy','sell']){
            const p=JSON.parse(fs.readFileSync('probe-'+side+'-result.json','utf8'));
            const x=p.preview||{};
            console.log(JSON.stringify({
              stage:'sizing-probe',
              side,
              previewOk:p.ok,
              account:x.account ? {id:x.account.id,type:x.account.type,currency:x.account.currency,balance:x.account.balance,projectedBalance:x.account.projectedBalance}:null,
              sizing:x.sizing,
              quote:x.quote,
              exposure:x.exposure,
              failedChecks:(x.checks||[]).filter(z=>!z.ok).map(z=>({name:z.name,detail:z.detail}))
            }));
          }
          JS

      - name: Live risk preview only when strategy has an actionable signal
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const row=JSON.parse(fs.readFileSync('selected.json','utf8'));
          const signal=row.signal || {};
          if(signal.status!=='SIGNAL_READY' || !['BUY','SELL'].includes(signal.action)) {
            console.log(JSON.stringify({stage:'preview',skipped:true,reason:'NO_ACTIONABLE_SIGNAL'}));
            process.exit(0);
          }
          const payload={
            symbol:'USDCHF',
            tradableInstrumentId:row.instrument.tradableInstrumentId,
            tradeRouteId:row.instrument.tradeRouteId,
            infoRouteId:row.instrument.infoRouteId,
            side:signal.action.toLowerCase(),
            type:'market',
            lots:0.01,
            qty:1000,
            stopLoss:Number(signal.stopLoss),
            takeProfit:Number(signal.takeProfit)
          };
          fs.writeFileSync('preview-request.json',JSON.stringify(payload));
          JS
          if [ ! -f preview-request.json ]; then exit 0; fi
          status=$(curl -sS -o preview.json -w "%{http_code}" -X POST "$GATEWAY/api/tradelocker/risk-preview" -H "content-type: application/json" --data-binary @preview-request.json)
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const p=JSON.parse(fs.readFileSync('preview.json','utf8'));
          const x=p.preview || {};
          console.log(JSON.stringify({
            stage:'preview',
            httpStatus:process.env.STATUS,
            ok:p.ok,
            dryRun:p.dryRun,
            account:x.account ? {id:x.account.id,type:x.account.type,currency:x.account.currency,balance:x.account.balance,projectedBalance:x.account.projectedBalance}:null,
            quote:x.quote,
            sizing:x.sizing,
            exposure:x.exposure,
            failedChecks:(x.checks||[]).filter(c=>!c.ok),
            order:x.order
          }));
          JS
        env:
          STATUS: ignored
