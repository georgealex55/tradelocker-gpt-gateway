name: Portfolio 144 - Data Recheck and Evaluation

on:
  workflow_dispatch:
  push:
    branches: [research/portfolio-144]
    paths: [".github/workflows/research-portfolio-evaluate.yml"]

permissions:
  contents: read
  actions: read

concurrency:
  group: portfolio-144-evaluation
  cancel-in-progress: false

jobs:
  evaluate:
    if: github.ref == 'refs/heads/research/portfolio-144'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RESEARCH_GATEWAY: https://tradelocker-gpt-gateway-fnpid8533-georgealex1925-2750s-projects.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:research
      - name: Download frozen dataset
        uses: actions/download-artifact@v4
        with:
          name: portfolio-144-evaluation
          path: research-output
          run-id: 36506041404
          github-token: ${{ github.token }}
      - name: Verify gap review and validate frozen dataset
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';
          const data = JSON.parse(fs.readFileSync('research-output/dataset.rechecked.json'));
          const review = JSON.parse(fs.readFileSync('research-output/recheck.json'));
          const hash = createHash('sha256').update(JSON.stringify(data)).digest('hex');
          if (review.complete !== true || review.resultInputHash !== hash || hash !== '61e9d2fae987acf428cb8034e04514d7f84ad01e9e1a2f03d606de09ea740c14') throw new Error('RESEARCH_REVIEW_HASH_MISMATCH');
          JS
          node --loader ./scripts/research-loader.mjs scripts/portfolio-144-audit.mjs research-output/dataset.rechecked.json
      - name: Run corrected 12-combination pilot
        env:
          TRADE_APPROVAL_KEY: ${{ secrets.TRADE_APPROVAL_KEY }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npm run research:portfolio -- run --gateway "$RESEARCH_GATEWAY" --input research-output/dataset.rechecked.json --limit 12 --output research-output
      - name: Verify corrected pilot
        run: node scripts/portfolio-144-verify-results.mjs research-output/results.json 12 pilot
      - name: Exercise corrected adaptive risk on real history
        run: |
          node --loader ./scripts/research-loader.mjs --input-type=module <<'JS'
          import fs from 'node:fs';
          import { validateDataset, preparePair, fitSchedule, evaluateCombo } from './lib/research/prepare.mjs';
          import { combinations } from './lib/research/policies.mjs';
          const prepared=validateDataset(JSON.parse(fs.readFileSync('research-output/dataset.rechecked.json')));
          for(const symbol of Object.keys(prepared.pairs))prepared.pairs[symbol]=preparePair(prepared.pairs[symbol]);
          const result=evaluateCombo(prepared,combinations().find(c=>c.id==='C097'),fitSchedule(prepared));
          const raised=result.validation.trades.filter(t=>t.riskPolicyPercent===1).length;
          if(!raised)throw new Error('RESEARCH_ADAPTIVE_RISK_NOT_EXERCISED');
          fs.writeFileSync('research-output/adaptive-pilot.json',JSON.stringify({completed:1,failures:0,results:[{combo_id:'C097',status:'COMPLETED',result_json:result}]}));
          console.log(JSON.stringify({stage:'adaptive-pilot',combo:'C097',raisedRiskTrades:raised,validationTrades:result.validation.trades.length}));
          JS
          node scripts/portfolio-144-verify-results.mjs research-output/adaptive-pilot.json 1
      - name: Resume reviewed full 144-combination matrix
        env:
          TRADE_APPROVAL_KEY: ${{ secrets.TRADE_APPROVAL_KEY }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npm run research:portfolio -- run --gateway "$RESEARCH_GATEWAY" --input research-output/dataset.rechecked.json --limit 144 --output research-output
      - name: Verify full matrix ledgers
        run: node scripts/portfolio-144-verify-results.mjs research-output/results.json 144 | tee research-output/ledger-verification.json
      - name: Upload research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-144-evaluation
          path: |
            research-output/dataset.rechecked.json
            research-output/dataset.rechecked.audit.json
            research-output/recheck.json
            research-output/dataset.audit.json
            research-output/results.json
            research-output/results.csv
            research-output/progress.json
            research-output/ledger-verification.json
            research-output/adaptive-pilot.json
          if-no-files-found: warn
          retention-days: 30
