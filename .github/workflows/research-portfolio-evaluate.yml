name: Portfolio 144 - Data Recheck and Evaluation

on:
  workflow_dispatch:
  push:
    branches: [research/portfolio-144]
    paths: [".github/workflows/research-portfolio-evaluate.yml"]

permissions:
  contents: read
  actions: read

concurrency:
  group: portfolio-144-evaluation
  cancel-in-progress: false

jobs:
  evaluate:
    if: github.ref == 'refs/heads/research/portfolio-144'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RESEARCH_GATEWAY: https://tradelocker-gpt-gateway-fnpid8533-georgealex1925-2750s-projects.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:research
      - name: Download frozen dataset
        uses: actions/download-artifact@v4
        with:
          name: portfolio-144-evaluation
          path: research-output
          run-id: 36506041404
          github-token: ${{ github.token }}
      - name: Verify gap review and validate frozen dataset
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';
          const data = JSON.parse(fs.readFileSync('research-output/dataset.rechecked.json'));
          const review = JSON.parse(fs.readFileSync('research-output/recheck.json'));
          const hash = createHash('sha256').update(JSON.stringify(data)).digest('hex');
          if (review.complete !== true || review.resultInputHash !== hash || hash !== '61e9d2fae987acf428cb8034e04514d7f84ad01e9e1a2f03d606de09ea740c14') throw new Error('RESEARCH_REVIEW_HASH_MISMATCH');
          JS
          node --loader ./scripts/research-loader.mjs scripts/portfolio-144-audit.mjs research-output/dataset.rechecked.json
      - name: Read persisted successful pilot proof
        env:
          TRADE_APPROVAL_KEY: ${{ secrets.TRADE_APPROVAL_KEY }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs/promises';
          const runId='portfolio-144-v1-3192080bc2b2ec30eb46';
          const response=await fetch(new URL('/api/trading/portfolio-144?runId='+runId,process.env.RESEARCH_GATEWAY),{redirect:'error',signal:AbortSignal.timeout(30000),headers:{'x-trade-approval-key':process.env.TRADE_APPROVAL_KEY,'x-vercel-protection-bypass':process.env.VERCEL_AUTOMATION_BYPASS_SECRET}});
          if(!response.ok)throw new Error('RESEARCH_PILOT_READ_FAILED');
          const data=await response.json();
          if(data.run?.id!==runId || data.run?.manifest_json?.inputHash!=='61e9d2fae987acf428cb8034e04514d7f84ad01e9e1a2f03d606de09ea740c14')throw new Error('RESEARCH_PILOT_IDENTITY_MISMATCH');
          data.results=data.results.filter(r=>/^C00[1-9]$|^C01[0-2]$/.test(r.combo_id));
          data.completed=data.results.filter(r=>r.status==='COMPLETED').length;
          data.failures=data.results.filter(r=>r.status==='FAILED').length;
          await fs.mkdir('pilot-proof',{recursive:true});
          await fs.writeFile('pilot-proof/results.json',JSON.stringify(data));
          JS
      - name: Verify controlled pilot before full matrix
        run: node scripts/portfolio-144-verify-results.mjs pilot-proof/results.json 12
      - name: Resume reviewed full 144-combination matrix
        env:
          TRADE_APPROVAL_KEY: ${{ secrets.TRADE_APPROVAL_KEY }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npm run research:portfolio -- run --gateway "$RESEARCH_GATEWAY" --input research-output/dataset.rechecked.json --limit 144 --output research-output
      - name: Verify full matrix ledgers
        run: node scripts/portfolio-144-verify-results.mjs research-output/results.json 144 | tee research-output/ledger-verification.json
      - name: Upload research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-144-evaluation
          path: |
            research-output/dataset.rechecked.json
            research-output/dataset.rechecked.audit.json
            research-output/recheck.json
            research-output/dataset.audit.json
            research-output/results.json
            research-output/results.csv
            research-output/progress.json
            research-output/ledger-verification.json
          if-no-files-found: warn
          retention-days: 30
