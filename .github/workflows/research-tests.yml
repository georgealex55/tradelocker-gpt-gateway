name: Research tests

on:
  push:
    branches:
      - research/portfolio-144
  pull_request:
    branches:
      - main

jobs:
  research-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:research
